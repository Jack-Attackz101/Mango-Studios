<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Outreach | Mango Studios</title>
<link rel="icon" href="/assets/logo-badge.png">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Inter Tight",system-ui,sans-serif;background:#fff8ec;color:#2b1d0e}
main{max-width:1000px;margin:0 auto;padding:32px 20px}
h1{margin:0 0 4px;font-size:32px}.sub{color:#7a6650;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat,.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat b{display:block;font-size:30px;color:#f28c00}.stat span{font-size:13px;color:#7a6650}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card h2{font-size:16px;margin:0 0 12px}canvas{width:100%;height:220px}
.legend{font-size:12px;color:#7a6650;margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}
</style>
</head>
<body>
<main>
<h1>Outreach dashboard</h1>
<p class="sub">Daily totals only. Updated <span id="upd"></span>.</p>
<div class="stats" id="stats"></div>
<div class="grid">
<div class="card"><h2>Emails per day (new vs follow-up)</h2><canvas id="c1"></canvas><div class="legend" id="l1"></div></div>
<div class="card"><h2>Replies per day</h2><canvas id="c2"></canvas></div>
<div class="card"><h2>LinkedIn posts per day</h2><canvas id="c3"></canvas></div>
<div class="card"><h2>Emails by service line</h2><canvas id="c4"></canvas><div class="legend" id="l4"></div></div>
</div>
</main>
<script>
const C=['#f28c00','#4a9d5b','#3b6fd8'];
function bars(id,labels,series,colors){
  const cv=document.getElementById(id),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const tot=labels.map((_,i)=>series.reduce((s,a)=>s+a[i],0)),max=Math.max(1,...tot);
  const pad=24,bw=(W-pad)/labels.length;x.font='11px Inter Tight, sans-serif';x.fillStyle='#7a6650';
  x.fillText(max,0,12);x.fillText(0,0,H-pad);
  labels.forEach((l,i)=>{let y=H-pad;series.forEach((s,k)=>{const h=s[i]/max*(H-pad-16);x.fillStyle=colors[k];x.fillRect(pad+i*bw+bw*.15,y-h,bw*.7,h);y-=h});
    x.fillStyle='#2b1d0e';if(tot[i])x.fillText(tot[i],pad+i*bw+bw*.42,y-3);
    x.fillStyle='#7a6650';x.fillText(l.slice(5),pad+i*bw+bw*.2,H-8)});
}
function legend(id,names){document.getElementById(id).innerHTML=names.map((n,i)=>`<i style="background:${C[i]}"></i>${n}`).join('')}
fetch('/outreach/totals.json',{cache:'no-store'}).then(r=>r.json()).then(({days})=>{
  const L=days.map(d=>d.date),g=k=>days.map(d=>d[k]),sum=k=>g(k).reduce((a,b)=>a+b,0);
  document.getElementById('upd').textContent=L[L.length-1]||'never';
  document.getElementById('stats').innerHTML=[['New emails',sum('new')],['Follow-ups',sum('followup')],['Replies',sum('replies')],['LinkedIn posts',sum('posts')]]
    .map(([n,v])=>`<div class="stat"><b>${v}</b><span>${n}</span></div>`).join('');
  bars('c1',L,[g('new'),g('followup')],C);legend('l1',['New','Follow-up']);
  bars('c2',L,[g('replies')],[C[2]]);bars('c3',L,[g('posts')],[C[1]]);
  bars('c4',L,[g('sites'),g('automations'),g('agents')],C);legend('l4',['Sites & Apps','Automations','Agents']);
});
</script>
</body>
</html>
