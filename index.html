<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mango Studios</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: ui-sans-serif, system-ui, sans-serif; background: #14110f; color: #f4ece4; display: grid; place-items: center; padding: 32px; }
    main { max-width: 36rem; }
    p.mark { color: #f2a65a; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 12px; }
    h1 { font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 0.95; margin-bottom: 16px; }
    p.lede { color: #cbbbae; font-size: 1.15rem; line-height: 1.5; }
    p.by { margin-top: 28px; color: #8f8176; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <p class="mark">Mango Studios</p>
    <h1>Apps, sites, and digital products.</h1>
    <p class="lede">We build software and ship whatever else can make money.</p>
    <p class="by">Jack Koll-Gunderson</p>
  </main>
</body>
</html>
